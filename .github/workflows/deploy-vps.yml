name: Deploy to VPS

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # VPS_DEPLOY_KEY is stored as a single base64 line (see DEPLOYMENT.md)
      # to avoid multi-line private keys getting silently corrupted when
      # pasted into GitHub's secret box. Decode it into a step output (not a
      # file — appleboy/ssh-action runs as its own Docker container with a
      # different filesystem, so a file written by this step isn't visible
      # to it; `key_path` pointing at a runner-side path fails with "no
      # such file or directory" even though the file genuinely exists here).
      - name: Decode deploy key
        id: deploy_key
        run: |
          KEY=$(echo "${{ secrets.VPS_DEPLOY_KEY }}" | base64 -d)
          echo "key<<EOF" >> "$GITHUB_OUTPUT"
          echo "$KEY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ steps.deploy_key.outputs.key }}
          script: |
            set -e
            cd /opt/wedding-os
            git pull origin main
            docker compose --env-file .env.production -f docker-compose.vps.yml --profile tools run --rm migrate
            docker compose --env-file .env.production -f docker-compose.vps.yml up -d --build
            docker image prune -f

      - name: Verify the site responds
        run: |
          sleep 5
          curl -fsS https://weddingos.autopilot-studio.com > /dev/null
