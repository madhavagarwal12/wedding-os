name: Deploy to VPS

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # VPS_DEPLOY_KEY is stored as a single base64 line (see DEPLOYMENT.md)
      # to avoid multi-line private keys getting silently corrupted when
      # pasted into GitHub's secret box. Decode it back to a real key file
      # here since appleboy/ssh-action's `key` input wants raw PEM content,
      # not base64.
      - name: Decode deploy key
        run: |
          echo "${{ secrets.VPS_DEPLOY_KEY }}" | base64 -d > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key_path: /tmp/deploy_key
          script: |
            set -e
            cd /opt/wedding-os
            git pull origin main
            docker compose --env-file .env.production -f docker-compose.vps.yml --profile tools run --rm migrate
            docker compose --env-file .env.production -f docker-compose.vps.yml up -d --build
            docker image prune -f

      - name: Verify the site responds
        run: |
          sleep 5
          curl -fsS https://weddingos.autopilot-studio.com > /dev/null
