services:
  # Everything shares the single external "app-network" (the same network
  # Traefik and your other VPS containers use). We deliberately don't give
  # postgres/app a second, isolated network: on this host, containers with
  # two networks attached unreliably lost connectivity on one of them
  # (confirmed by reproducing it locally — see git history for
  # docker-compose.vps.yml around 2026-08-24). Postgres is still protected
  # by its password; it's just reachable from sibling containers on the
  # shared network the same way it already is for helios-postgres etc.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: weddingos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: weddingos
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weddingos"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-off tooling container: `docker compose -f docker-compose.vps.yml
  # --profile tools run --rm migrate` applies pending migrations and seeds
  # the first Owner account. Never started by `up` on its own (profiles).
  migrate:
    build:
      context: ./app
      target: builder
    profiles: ["tools"]
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgres://weddingos:${POSTGRES_PASSWORD}@postgres:5432/weddingos?sslmode=disable
    command: sh -c "npx prisma migrate deploy && npx prisma db seed"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  app:
    build:
      context: ./app
      target: runner
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgres://weddingos:${POSTGRES_PASSWORD}@postgres:5432/weddingos?sslmode=disable
      PORT: 3000
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.weddingos.rule=Host(`weddingos.autopilot-studio.com`)
      - traefik.http.routers.weddingos.entrypoints=websecure
      # Confirmed via `docker inspect root-traefik-1 --format '{{json .Args}}'`
      - traefik.http.routers.weddingos.tls.certresolver=mytlschallenge
      - traefik.http.services.weddingos.loadbalancer.server.port=3000

networks:
  app-network:
    external: true

volumes:
  postgres_data:
  uploads_data:
